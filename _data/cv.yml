- title: Experience
  type: experience
  contents:
    - company: Alibaba · Taotian Group
      role: MNN Tech Lead
      year: 2020 - Present
      highlights:
        - label: MNN core architecture
          text: Lead MNN architecture and heterogeneous performance optimization across ARM CPUs, Metal/OpenCL/Vulkan GPUs, and Hexagon/CoreML/NNAPI accelerators, covering operator kernels, memory planning, graph optimization and fusion, and model conversion.
        - label: On-device AI platform
          text: Built an embedded Python runtime and end-to-end deployment stack with CV/audio modules, Python APIs, and CI/CD, enabling dozens of algorithms for Pailitao visual search, Taobao Live, security, and feed.
        - label: MNN-LLM
          text: Initiated and lead MNN-LLM for 100+ language and multimodal models, with 2/3/4/8-bit and mixed-precision quantization, KV-cache and attention optimization, and speculative decoding.
        - label: Production & open source
          text: Drove MNN adoption across Taobao, Xianyu, Quark, and Qwen; deployed on-device LLMs in Taobao and Xianyu search and recommendation scenarios at tens-of-millions-user scale; supported DingTalk, Youku, Taobao Instant Commerce, and Amap; grew MNN to 15.8K+ GitHub stars.
    - company: Cambricon Technologies
      role: Compiler Engineer Intern
      year: 2018 - 2020
      highlights:
        - text: Developed compiler and linker components for Cambricon's BANG toolchain, focusing on heterogeneous linking; subsequently optimized Caffe operators for MLU accelerators.
    - company: Megvii
      role: Algorithm Engineer Intern
      year: 2019
      highlights:
        - text: Optimized traffic video understanding algorithms and productionized them in C++.
    - company: Microsoft Asia Engineering Academy
      role: Software Engineer Intern
      year: 2016
      highlights:
        - text: Evaluated LevelDB, Presto, and Hadoop for advertising data storage and analytics workloads.

