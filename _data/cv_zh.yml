- title: 工作经历
  type: experience
  contents:
    - company: 阿里巴巴 · 淘天集团
      role: 高级技术专家 · MNN 技术负责人
      year: 2020 - 至今
      highlights:
        - label: MNN 核心架构
          text: 负责 MNN 架构及异构硬件性能优化，覆盖 ARM CPU、Metal/OpenCL/Vulkan GPU 与 Hexagon/CoreML/NNAPI 加速后端，包括算子内核、内存规划、图优化与融合、模型转换；MNN GitHub Star 15.8K+。
        - label: 端侧 AI 平台
          text: 构建端侧 Python 运行时和端到端部署体系，支撑拍立淘、淘宝直播、安全、信息流等数十个算法，并服务夸克、千问、钉钉、优酷、淘宝闪购和高德等业务。
        - label: MNN-LLM 与业务
          text: 发起并负责 MNN-LLM，支持 100+ 文本及多模态模型，覆盖 2/3/4/8-bit 与混合精度量化、KV Cache 与 Attention 优化、投机解码；推动端侧大模型在手淘、闲鱼搜推场景落地，覆盖千万级用户。
        - label: 端侧 SLM
          text: 带领团队从零训练面向端侧业务的 0.3B SLM，覆盖数据采集与质量评估、预训练、SFT、RL 和端到端模型评测。
    - company: 寒武纪科技
      role: 编译器工程师实习生
      year: 2018 - 2020
      highlights:
        - text: 从事寒武纪 BANG 编译器与链接器研发，重点参与异构链接能力建设；并基于 Caffe 优化寒武纪 MLU 算子性能。
    - company: 旷视科技
      role: 算法工程师实习生
      year: 2019
      highlights:
        - text: 优化交通视频理解算法，并完成 C++ 工程化落地。
    - company: 微软亚洲工程院
      role: 软件工程师实习生
      year: 2016
      highlights:
        - text: 调研 LevelDB、Presto 和 Hadoop 在广告数据存储与分析场景中的应用。

